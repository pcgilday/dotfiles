set -g default-terminal "xterm-256color"
# Force zsh as the pane shell instead of inheriting $SHELL. Keeps tmux consistent
# with the preferred interactive shell everywhere, and avoids machines where $SHELL
# points at a shell that misbehaves interactively (e.g. a minimal bash lacking
# readline/progcomp, which breaks fzf + bash-completion).
set -g default-command "exec zsh -l"
set -g mouse on
setw -g mode-keys vi

# set prefix
unbind C-b
set-option -g prefix C-Space
bind-key C-space send-prefix

bind-key | split-window -h
bind-key - split-window -v

# Navigate between panes with vim like motions
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# enter to toggle maximizing pane
bind Enter resize-pane -Z

set -g status-left '#I #W'

set -g @plugin 'tmux-plugins/tmux-resurrect'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
